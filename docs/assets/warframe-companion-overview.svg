<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Warframe Companion system overview</title>
  <desc id="desc">A left-to-right overview of the desktop experience, Companion-owned agent harness, typed tools, read-only data sources, and the evidence and evaluation loop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111F"/>
      <stop offset="0.55" stop-color="#0B1727"/>
      <stop offset="1" stop-color="#111C2D"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172A46"/>
      <stop offset="1" stop-color="#102237"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E7490"/>
      <stop offset="1" stop-color="#155E75"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D4BD1"/>
      <stop offset="1" stop-color="#4935A5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000814" flood-opacity="0.36"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#71829A"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", "Microsoft YaHei", Arial, sans-serif; }
      .eyebrow { fill: #67E8F9; font-size: 14px; font-weight: 700; letter-spacing: 2.4px; }
      .title { fill: #F8FAFC; font-size: 38px; font-weight: 760; letter-spacing: -0.8px; }
      .subtitle { fill: #9FB0C5; font-size: 17px; }
      .lane { fill: #7DD3FC; font-size: 13px; font-weight: 760; letter-spacing: 1.7px; }
      .card-title { fill: #F8FAFC; font-size: 21px; font-weight: 720; }
      .card-subtitle { fill: #BAE6FD; font-size: 14px; font-weight: 650; }
      .body { fill: #AEBED0; font-size: 15px; }
      .small { fill: #91A4BA; font-size: 13px; }
      .mono { fill: #DDF6FF; font-family: "Cascadia Code", Consolas, monospace; font-size: 14px; }
      .metric { fill: #F8FAFC; font-size: 20px; font-weight: 760; }
      .metric-label { fill: #96A8BC; font-size: 12px; }
      .flow-label { fill: #7DD3FC; font-size: 12px; font-weight: 650; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#bg)"/>
  <circle cx="1280" cy="-40" r="310" fill="#0E7490" opacity="0.08"/>
  <circle cx="50" cy="900" r="330" fill="#6D4BD1" opacity="0.07"/>
  <path d="M0 174 H1440" stroke="#23364C" stroke-width="1"/>

  <g transform="translate(70 58)">
    <text class="eyebrow" x="0" y="0">SYSTEM OVERVIEW · 当前公开实现</text>
    <text class="title" x="0" y="51">Warframe Companion</text>
    <text class="subtitle" x="0" y="84">Windows 本地优先 · 只读数据访问 · Agent 负责选择工具，确定性服务负责提供事实</text>
  </g>
  <g transform="translate(1118 62)">
    <rect width="252" height="58" rx="18" fill="#102C32" stroke="#1E6B70"/>
    <circle cx="30" cy="29" r="7" fill="#34D399"/>
    <text x="50" y="25" fill="#D1FAE5" font-size="13" font-weight="700">SAFE BY DEFAULT</text>
    <text x="50" y="43" fill="#8FB7B0" font-size="12">No game / trade automation</text>
  </g>

  <!-- column labels -->
  <text class="lane" x="70" y="213">01 · EXPERIENCE</text>
  <text class="lane" x="373" y="213">02 · COMPANION CONTROL PLANE</text>
  <text class="lane" x="748" y="213">03 · TYPED TOOLS</text>
  <text class="lane" x="1093" y="213">04 · READ-ONLY SOURCES</text>

  <!-- experience -->
  <g transform="translate(70 238)" filter="url(#shadow)">
    <rect width="250" height="252" rx="22" fill="#111F31" stroke="#2B4058"/>
    <rect x="20" y="20" width="52" height="52" rx="15" fill="url(#cyan)"/>
    <rect x="32" y="32" width="28" height="20" rx="3" fill="none" stroke="#CFFAFE" stroke-width="2"/>
    <path d="M39 59 H53" stroke="#CFFAFE" stroke-width="2" stroke-linecap="round"/>
    <text class="card-title" x="20" y="99">Windows Desktop</text>
    <text class="card-subtitle" x="20" y="124">Electron · React · TypeScript</text>
    <path d="M20 145 H230" stroke="#294057"/>
    <text class="body" x="20" y="172">Agent 对话与流式事件</text>
    <text class="body" x="20" y="200">原生查询卡与证据展开</text>
    <text class="body" x="20" y="228">系统健康与模型配置</text>
  </g>
  <g transform="translate(70 512)">
    <rect width="250" height="94" rx="18" fill="#0D1928" stroke="#516174" stroke-dasharray="6 5"/>
    <text x="20" y="30" fill="#D7E1EC" font-size="15" font-weight="700">Remote Channels</text>
    <text class="small" x="20" y="54">QQ / OpenClaw + future adapters</text>
    <text class="small" x="20" y="75">Channel Adapter → Local Gateway</text>
  </g>

  <!-- control plane -->
  <g transform="translate(373 238)" filter="url(#shadow)">
    <rect width="322" height="368" rx="22" fill="url(#hero)" stroke="#2E5C85" stroke-width="1.4"/>
    <text class="card-title" x="24" y="42">Warframe Agent Harness</text>
    <text class="card-subtitle" x="24" y="67">Companion-owned orchestration</text>

    <g transform="translate(24 91)">
      <rect width="274" height="56" rx="13" fill="#0D1A2A" stroke="#2F516E"/>
      <circle cx="23" cy="28" r="6" fill="#38BDF8"/>
      <text x="42" y="25" fill="#E5F6FF" font-size="15" font-weight="700">Capability + policy gate</text>
      <text class="small" x="42" y="43">身份、健康、权限与只读边界</text>
    </g>
    <g transform="translate(24 158)">
      <rect width="274" height="56" rx="13" fill="#0D1A2A" stroke="#2F516E"/>
      <circle cx="23" cy="28" r="6" fill="#A78BFA"/>
      <text x="42" y="25" fill="#F1ECFF" font-size="15" font-weight="700">Model adapter + agent loop</text>
      <text class="small" x="42" y="43">local rules / OpenAI-compatible</text>
    </g>
    <g transform="translate(24 225)">
      <rect width="274" height="56" rx="13" fill="#0D1A2A" stroke="#2F516E"/>
      <circle cx="23" cy="28" r="6" fill="#34D399"/>
      <text x="42" y="25" fill="#E5FFF5" font-size="15" font-weight="700">Execution controls</text>
      <text class="small" x="42" y="43">tool limit · timeout · cancellation</text>
    </g>
    <g transform="translate(24 292)">
      <rect width="274" height="52" rx="13" fill="#102C32" stroke="#1F6A70"/>
      <text x="18" y="23" fill="#CFFAFE" font-size="14" font-weight="700">Harness decides the final boundary</text>
      <text x="18" y="41" fill="#8FB7B0" font-size="12">facts · refusal · evidence · conclusion</text>
    </g>
  </g>

  <!-- typed tools -->
  <g transform="translate(748 238)" filter="url(#shadow)">
    <rect width="292" height="368" rx="22" fill="#101E2F" stroke="#2B4058"/>
    <text class="card-title" x="22" y="42">Local Application Service</text>
    <text class="card-subtitle" x="22" y="67">Stable contracts, not CLI text</text>
    <g transform="translate(22 91)">
      <rect width="248" height="40" rx="11" fill="url(#cyan)"/>
      <text class="mono" x="18" y="26">market.query(...)</text>
    </g>
    <g transform="translate(22 142)">
      <rect width="248" height="40" rx="11" fill="url(#cyan)"/>
      <text class="mono" x="18" y="26">drops.search(...)</text>
    </g>
    <g transform="translate(22 193)">
      <rect width="248" height="40" rx="11" fill="#163C48" stroke="#25677A"/>
      <text class="mono" x="18" y="26">account.getSnapshot()</text>
    </g>
    <g transform="translate(22 244)">
      <rect width="248" height="40" rx="11" fill="#163C48" stroke="#25677A"/>
      <text class="mono" x="18" y="26">system.getHealth()</text>
    </g>
    <g transform="translate(22 296)">
      <rect width="248" height="48" rx="12" fill="#101A29" stroke="#3A5068"/>
      <text x="17" y="21" fill="#E0F2FE" font-size="14" font-weight="700">ToolResult&lt;T&gt;</text>
      <text class="small" x="17" y="39">data · evidence · presentation · warnings</text>
    </g>
  </g>

  <!-- sources -->
  <g transform="translate(1093 238)" filter="url(#shadow)">
    <rect width="277" height="368" rx="22" fill="#101E2F" stroke="#2B4058"/>
    <text class="card-title" x="22" y="42">Deterministic data layer</text>
    <text class="card-subtitle" x="22" y="67">Freshness and failure stay explicit</text>
    <g transform="translate(22 91)">
      <rect width="233" height="68" rx="13" fill="#0D1A2A" stroke="#2F516E"/>
      <text x="17" y="27" fill="#F8FAFC" font-size="15" font-weight="700">Warframe.Market v2</text>
      <text class="small" x="17" y="49">实时只读市场适配器</text>
    </g>
    <g transform="translate(22 171)">
      <rect width="233" height="84" rx="13" fill="#0D1A2A" stroke="#2F516E"/>
      <text x="17" y="27" fill="#F8FAFC" font-size="15" font-weight="700">WFCD public drops</text>
      <text class="small" x="17" y="49">版本化快照 + 原子缓存</text>
      <text class="small" x="17" y="68">jsDelivr ↔ GitHub Raw 对照</text>
    </g>
    <g transform="translate(22 267)">
      <rect width="233" height="77" rx="13" fill="#0D1A2A" stroke="#2F516E"/>
      <text x="17" y="27" fill="#F8FAFC" font-size="15" font-weight="700">AlecaFrame + health</text>
      <text class="small" x="17" y="49">脱敏快照 · 构建与依赖状态</text>
    </g>
  </g>

  <!-- arrows -->
  <path d="M320 364 H357" stroke="#38BDF8" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text class="flow-label" x="323" y="351">IPC</text>
  <path d="M695 364 H732" stroke="#38BDF8" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text class="flow-label" x="696" y="351">CALL</text>
  <path d="M1040 364 H1077" stroke="#38BDF8" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text class="flow-label" x="1042" y="351">READ</text>
  <path d="M1093 461 H1056" stroke="#71829A" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowMuted)"/>
  <text x="1052" y="449" text-anchor="end" fill="#8296AD" font-size="11">EVIDENCE</text>
  <path d="M320 559 H357" fill="none" stroke="#71829A" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrowMuted)"/>

  <!-- assurance loop -->
  <g transform="translate(70 657)">
    <rect width="1300" height="166" rx="24" fill="#0B1726" stroke="#2B4058"/>
    <text class="lane" x="22" y="31">05 · EVIDENCE &amp; REGRESSION LOOP</text>
    <text x="22" y="61" fill="#DDEAF5" font-size="16" font-weight="680">每一次执行都留下可判分轨迹；模型输出不能覆盖工具事实</text>

    <g transform="translate(22 83)">
      <rect width="214" height="58" rx="14" fill="#132338" stroke="#304B68"/>
      <text class="metric" x="18" y="26">41</text>
      <text class="metric-label" x="18" y="45">SYNTHETIC / REDACTED CASES</text>
    </g>
    <path d="M248 112 H293" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(307 83)">
      <rect width="246" height="58" rx="14" fill="#132338" stroke="#304B68"/>
      <text x="18" y="25" fill="#F8FAFC" font-size="16" font-weight="700">AgentTrace</text>
      <text class="small" x="18" y="44">calls · result · latency · conclusion</text>
    </g>
    <path d="M565 112 H610" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(624 83)">
      <rect width="308" height="58" rx="14" fill="#132338" stroke="#304B68"/>
      <text x="18" y="25" fill="#F8FAFC" font-size="16" font-weight="700">Deterministic scorer</text>
      <text class="small" x="18" y="44">tool choice · facts · evidence · safety</text>
    </g>
    <path d="M944 112 H989" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(1003 83)">
      <rect width="275" height="58" rx="14" fill="url(#violet)"/>
      <text x="18" y="25" fill="#FFFFFF" font-size="16" font-weight="700">Regression baseline</text>
      <text x="18" y="44" fill="#DDD6FE" font-size="13">shared contract across adapters</text>
    </g>
  </g>

  <!-- trace downlink -->
  <path d="M534 606 V638 Q534 646 526 646 H434 Q426 646 426 654" fill="none" stroke="#A78BFA" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="547" y="632" fill="#B9A7F8" font-size="12" font-weight="650">TRACE</text>

  <g transform="translate(70 858)">
    <circle cx="6" cy="0" r="5" fill="#38BDF8"/>
    <text class="small" x="18" y="5">实线：当前仓库已实现</text>
    <line x1="184" y1="0" x2="218" y2="0" stroke="#71829A" stroke-width="2" stroke-dasharray="5 4"/>
    <text class="small" x="230" y="5">虚线：独立仓库 / 外部边界</text>
    <text x="1300" y="5" text-anchor="end" fill="#62768D" font-size="12">Architecture scope · 2026-09</text>
  </g>
</svg>

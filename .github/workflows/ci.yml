name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Windows / Node 22 verification
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        shell: pwsh
        run: npm ci --no-fund

      - name: Check public repository contract
        shell: pwsh
        run: npm run check:repo

      - name: Block production dependency vulnerabilities
        shell: pwsh
        run: npm audit --omit=dev --audit-level=high

      - name: Build all workspaces
        shell: pwsh
        run: npm run build

      - name: Test all workspaces
        shell: pwsh
        run: npm test

      - name: Reproduce deterministic evaluation reports
        shell: pwsh
        run: |
          npm run eval --workspace @warframe-companion/agent-eval
          git diff --exit-code -- packages/agent-eval/reports
